---
# Resource limits are sized for 10 concurrent players per server; see the
# "Sizing" table in README.md for the documented basis of each value.
#
# The healthcheck below deliberately replaces the image's default, which runs
# LinuxGSM `monitor`. That default restarts a dead server and exits 0, so it can
# never report unhealthy — a crash-looping server shows "healthy" indefinitely.
# These checks report state instead of performing repair. `start_period` is
# generous because LinuxGSM downloads the dedicated server on first start.
services:
  minecraft:
    image: "ghcr.io/gameservermanagers/gameserver:mc\
      @sha256:58fad87dc7ac0929581150bc850ecea801bb96dcee1e2004cb8dfd2b24a28207"
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 2m
    labels:
      com.eslefi.gs.managed: "true"
      com.eslefi.gs.service: minecraft
      com.eslefi.gs.script: mcserver
    volumes:
      # Long syntax on purpose. The short `source:target` form is split on
      # colons, and `${VAR:-default}` contains one, so a parser that splits
      # before interpolating reads the default as the source and the path as
      # the target -- mounting the wrong directory and dropping /data entirely.
      - type: bind
        source: ${GS_DATA_ROOT:-/opt/gs}/minecraft
        target: /data
    environment:
      TZ: ${TZ:-Europe/Helsinki}
      # The complete set of variables these images actually read; verified
      # against /app/entrypoint.sh and /app/entrypoint-user.sh. Game settings
      # cannot be delivered here — see .env.example Tier 3 and `apply-config`.
      UPDATE_CHECK: ${GS_UPDATE_CHECK:-60}
      VALIDATE_ON_START: ${GS_VALIDATE_ON_START:-false}
      UID: ${GS_UID:-1000}
      GID: ${GS_GID:-1000}
      LGSM_GITHUBUSER: ${LGSM_GITHUBUSER:-GameServerManagers}
      LGSM_GITHUBREPO: ${LGSM_GITHUBREPO:-LinuxGSM}
      LGSM_GITHUBBRANCH: ${LGSM_GITHUBBRANCH:-master}
      LGSM_DEV: ${LGSM_DEV:-false}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[m]inecraft_server.jar' >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30m
    mem_limit: ${MINECRAFT_MEMORY_LIMIT:-8g}
    cpus: ${MINECRAFT_CPU_LIMIT:-3}

